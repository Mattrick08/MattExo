<style>
:root{--bb:#2a2112;--be:#2a1414;--bg:#0f1115;--card:#171a21;--card2:#1e222b;--line:#2a2f3a;--tx:#e8eaf0;--mut:#8b93a5;--ac:#ff7a3d;--ok:#3ecf8e;--ko:#ff5d5d;--r:12px}
:root[data-theme=light]{--bg:#f6f7fa;--card:#ffffff;--card2:#eceff5;--line:#d5d9e4;--tx:#1b1f2a;--mut:#5d6578;--ac:#e8611f;--bb:#fff3e6;--be:#fdeaea}
@media(prefers-color-scheme:light){:root:not([data-theme]){--bg:#f6f7fa;--card:#ffffff;--card2:#eceff5;--line:#d5d9e4;--tx:#1b1f2a;--mut:#5d6578;--ac:#e8611f;--bb:#fff3e6;--be:#fdeaea}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:var(--fs,15px)/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:18px;margin:0;cursor:pointer}
header h1 span{color:var(--ac)}
nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
button,.btn{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
button:hover{border-color:var(--ac)}
button.p{background:var(--ac);border-color:var(--ac);color:#111;font-weight:600}
button.d{color:var(--ko)}
button.s{padding:3px 8px;font-size:13px}
button.on{border-color:var(--ac);color:var(--ac)}
button:disabled{opacity:.5;cursor:wait}
input,select,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;width:100%}
textarea{resize:vertical;min-height:80px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
main{padding:18px;max-width:1500px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:200px minmax(0,1fr) 330px;gap:14px;align-items:start}
@media(max-width:1000px){.grid{grid-template-columns:1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.exo-item{display:block;width:100%;text-align:left;margin-bottom:6px}
.exo-item.on{background:var(--card2)}
.banner{padding:10px 14px;border-radius:8px;margin-bottom:12px}
.banner.busy{background:var(--bb);border:1px solid var(--ac)}
.banner.err{background:var(--be);border:1px solid var(--ko)}
.txt{background:var(--card2);border-radius:8px;padding:12px;margin:8px 0;overflow-x:auto}
.tag{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:1px 8px;color:var(--mut)}
.err-item{border-left:3px solid var(--ko);padding:6px 10px;margin:8px 0;background:var(--card2);border-radius:0 8px 8px 0}
.err-item.res{border-color:var(--ok);opacity:.65}
.sticky{position:sticky;top:64px}
.q{border-left:3px solid var(--ac);padding-left:10px;margin:8px 0}
.pg{max-width:100%;border:1px solid var(--line);border-radius:8px;margin:6px 0;display:block;background:#fff}
pre{white-space:pre-wrap;background:var(--card2);padding:10px;border-radius:8px;font-size:12px;overflow-x:auto}
.bar{height:6px;background:var(--card2);border-radius:6px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:var(--ok)}

:root{--gold:#d9b45a}
:root[data-theme=light]{--gold:#9a7418}
@media(prefers-color-scheme:light){:root:not([data-theme]){--gold:#9a7418}}
.grid.wide{grid-template-columns:200px minmax(0,1fr) 440px}
.dock{max-height:calc(100vh - 80px);overflow:auto}
.fab,.dock-x{display:none}
.book{display:grid;grid-template-columns:minmax(250px,330px) minmax(0,1fr);border:2px solid var(--gold);border-radius:18px;background:var(--card2);padding:8px}
.book.one{grid-template-columns:1fr;padding:6px;border-radius:14px}
.bk-l,.bk-r{background:var(--card);padding:16px 18px;min-height:420px;border:1px solid var(--line)}
.bk-l{border-radius:12px 0 0 12px;box-shadow:inset -16px 0 20px -14px rgba(0,0,0,.5)}
.bk-r{border-radius:0 12px 12px 0;border-left:0;box-shadow:inset 16px 0 20px -14px rgba(0,0,0,.5)}
.book.one .bk-l,.book.one .bk-r{border-radius:10px;min-height:0;box-shadow:none;border-left:1px solid var(--line)}
.bk-title{font:600 22px/1.25 Georgia,'Times New Roman',serif;margin:0 0 4px}
.sk-item{display:block;width:100%;text-align:left;border:0;border-left:3px solid transparent;border-radius:0 8px 8px 0;background:transparent;padding:6px 10px;margin:1px 0}
.sk-item:hover,.sk-item.on{background:var(--card2);border-left-color:var(--gold)}
.sk-item.sub{margin-left:18px;width:calc(100% - 18px);font-size:.93em;color:var(--mut)}
.sk-item.sub.on{color:var(--tx)}
.sk-sec{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:14px 0}
.sk-sec h4{margin:0 0 4px;font-size:.95em}
.sk-sec.when{border-color:var(--ac)}.sk-sec.stp{border-color:var(--gold)}.sk-sec.lim{border-color:var(--ko)}.sk-sec.exa{border-color:var(--ok)}
.sk-sec ol{margin:4px 0;padding-left:22px}.sk-sec li{margin:4px 0}
.chip{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:2px 10px;background:var(--card2);margin:2px 4px 2px 0}
.chip:hover{border-color:var(--gold)}
.chaps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chaps button.on{border-color:var(--gold);color:var(--gold)}
@media(max-width:800px){.book{grid-template-columns:1fr}.bk-l,.bk-r{border-radius:10px;border-left:1px solid var(--line);box-shadow:none;min-height:0}.bk-l{margin-bottom:8px}}
@media(max-width:1000px){
  .grid.wide{grid-template-columns:1fr}
  .dock{position:fixed;left:0;right:0;bottom:0;top:38vh;z-index:30;background:var(--bg);border-top:2px solid var(--gold);border-radius:14px 14px 0 0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));max-height:none;box-shadow:0 -10px 30px rgba(0,0,0,.45)}
  .dock-x{display:inline-block}
  .fab{display:block;position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:25;border-radius:999px;padding:10px 16px;background:var(--gold);border-color:var(--gold);color:#111;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.4)}
}
#printroot{display:none}
@media print{
  body{background:#fff!important;color:#000!important}
  body>*:not(#printroot){display:none!important}
  #printroot{display:block!important;color:#000;background:#fff;font:12pt/1.55 Georgia,'Times New Roman',serif;padding:0}
  #printroot h1{font-size:20pt;margin:0 0 4px}#printroot h2{font-size:16pt;border-bottom:1px solid #000;padding-bottom:3px;margin:22px 0 8px}
  #printroot h3{font-size:13pt;margin:14px 0 4px}#printroot h4{font-size:11pt;margin:8px 0 3px;color:#333}
  .pv-ex{break-before:page}.pv-ex:first-of-type{break-before:auto}
  .pv-c{border-left:3px solid #888;padding-left:10px}
  .pv-sk{break-inside:avoid;margin:10px 0}.pv-sub{margin-left:18px;border-left:2px solid #888;padding-left:10px}
}
</style>
</head>
<body>
<header>
  <h1 data-act="home">Matt<span>Exo</span></h1>
  <nav>
    <button data-act="home">TD</button>
    <button data-act="book">📖 Skill Hunter</button>
    <button data-act="carnet">Carnet d'erreurs</button>
    <button data-act="settings">Réglages</button>
    <button data-act="theme" title="Thème clair / sombre">◐</button>
    <button id="syncbtn" data-act="sync" hidden title="Synchroniser">⟳</button>
  </nav>
</header>
<main id="app"></main>
<div id="printroot"></div>

<script>
/* ---------- utils ---------- */
const $=(s,e=document)=>e.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// KaTeX : chaque formule n'est composée qu'une seule fois (cache), directement dans fmt
const KC=new Map();
const tex=m=>{
  if(!window.katex) return esc(m);          // KaTeX pas encore chargé : math() s'en charge ensuite
  let r=KC.get(m);if(r!==undefined) return r;
  const d=m.startsWith('$$')||m.startsWith('\\['),b=(m[0]==='$'&&!d)?m.slice(1,-1):m.slice(d?2:2,-2);
  try{r=katex.renderToString(b,{displayMode:d,throwOnError:false,output:'html'})}catch{r=esc(m)}
  KC.set(m,r);return r;
};
const fmt=t=>{
  // protège les formules (y compris multi-lignes) avant la mise en forme du texte
  const M=[];
  const s=String(t??'').replace(/\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|\$[^$\n]+?\$/g,m=>{M.push(m);return '\u0000'+(M.length-1)+'\u0000'});
  return esc(s).replace(/^#+\s*(.*)$/gm,'<b>$1</b>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^- /gm,'• ').replace(/\n/g,'<br>').replace(/\u0000(\d+)\u0000/g,(_,i)=>tex(M[+i]));
};
const ui=()=>{try{return {theme:'',size:15,...JSON.parse(localStorage.getItem('mattexo.ui')||'{}')}}catch{return {theme:'',size:15}}};
const applyUI=()=>{const u=ui(),r=document.documentElement;if(u.theme) r.dataset.theme=u.theme;else delete r.dataset.theme;r.style.setProperty('--fs',u.size+'px')};
const setUI=o=>{try{localStorage.setItem('mattexo.ui',JSON.stringify({...ui(),...o}))}catch{}applyUI()};
applyUI();
const LV={facile:'Plus facile',moyen:'Même niveau',difficile:'Plus difficile'};
const TAGS=['Calcul','Méthode','Cours','Étourderie','Rédaction','Autre'];
const LK=['facile','moyen','difficile'],DAY=864e5,INTERVALS=[1,3,7,14,30];
const exoProg=ex=>({gen:LK.filter(k=>ex.variants[k]).length,done:LK.filter(k=>ex.variants[k]&&ex.prog?.[k]==='done').length});
const tdProg=td=>td.exos.reduce((a,e)=>{const p=exoProg(e);a.gen+=p.gen;a.done+=p.done;a.tot+=3;return a},{gen:0,done:0,tot:0});
const pct=(a,b)=>b?Math.round(100*a/b):0;
const bar=(a,b)=>`<div class="bar"><i style="width:${pct(a,b)}%"></i></div>`;
const errDue=e=>e.due??(e.created+DAY);
const dueErrs=()=>st.errs.filter(e=>!e.resolved&&errDue(e)<=Date.now()).sort((a,b)=>errDue(a)-errDue(b));
const fmtDate=t=>new Date(t).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});

/* ---------- suppressions à propager (synchro) ---------- */
const getTomb=()=>{try{return JSON.parse(localStorage.getItem('mattexo.tomb')||'{}')}catch{return {}}};
const addTomb=ids=>{const t=getTomb(),n=Date.now();ids.forEach(i=>t[i]=n);try{localStorage.setItem('mattexo.tomb',JSON.stringify(t))}catch{}};

/* ---------- IndexedDB ---------- */
const DB={db:null,
  open(){return new Promise((ok,ko)=>{const r=indexedDB.open('mattexo',1);
    r.onupgradeneeded=()=>{r.result.createObjectStore('tds',{keyPath:'id'});r.result.createObjectStore('errs',{keyPath:'id'});};
    r.onsuccess=()=>{this.db=r.result;ok()};r.onerror=()=>ko(r.error)})},
  tx(s,m,f){return new Promise((ok,ko)=>{const t=this.db.transaction(s,m);const q=f(t.objectStore(s));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>ko(t.error)})},
  all(s){return this.tx(s,'readonly',o=>o.getAll())},
  put(s,v){v.updated=Date.now();return this.tx(s,'readwrite',o=>o.put(v)).then(r=>{scheduleSync();return r})},
  putRaw(s,v){return this.tx(s,'readwrite',o=>o.put(v))},
  del(s,k){addTomb(s==='tds'?['td:'+k,'pg:'+k]:['er:'+k]);return this.tx(s,'readwrite',o=>o.delete(k)).then(r=>{scheduleSync();return r})},
  delRaw(s,k){return this.tx(s,'readwrite',o=>o.delete(k))},
  clear(s){return this.tx(s,'readwrite',o=>o.clear())}
};

/* ---------- settings ---------- */
const DEF={provider:'openai',base:'https://api.openai.com/v1',model:'gpt-4.1',key:'',verify:true,effort:'',temp:'',maxout:'',vprov:'openai',vbase:'',vmodel:'',vkey:'',sbUrl:'',sbKey:''};
const settings=()=>{try{return {...DEF,...JSON.parse(localStorage.getItem('mattexo.settings')||'{}')}}catch{return {...DEF}}};

/* ---------- IA ---------- */
function toParts(m,prov){
  const imgs=m.imgs||(m.img?[m.img]:[]);
  if(!imgs.length) return m.content;
  const ims=imgs.map(u=>prov==='anthropic'
    ?{type:'image',source:{type:'base64',media_type:'image/jpeg',data:u.split(',')[1]}}
    :{type:'image_url',image_url:{url:u}});
  return [...ims,{type:'text',text:m.content}];
}
function imgData(file){return new Promise((ok,ko)=>{const im=new Image();im.onload=()=>{
  const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.85))};
  im.onerror=ko;im.src=URL.createObjectURL(file)})}
/* limites : lues dans les en-têtes de réponse (si le navigateur les expose) */
function captureLimits(r){
  const o={};
  r.headers.forEach((v,k)=>{if(/ratelimit|retry-after/i.test(k)) o[k.toLowerCase()]=v});
  if(Object.keys(o).length){
    st.limits={h:o,t:Date.now(),model:settings().model};
    try{localStorage.setItem('mattexo.limits',JSON.stringify(st.limits))}catch{}
  }
}
function apiErr(r,d){
  const ra=r.headers.get('retry-after');
  return new Error((d.error?.message||('Erreur '+r.status))+(ra?` (réessaie dans ${ra} s)`:''));
}
function limitsHtml(){
  const L=st.limits;
  if(!L) return '<p class="mut">Aucune mesure pour l\'instant. Clique sur « Tester ma limite ».</p>';
  const h=L.h,g=k=>h['x-ratelimit-'+k];
  const rows=[['Requêtes : limite',g('limit-requests')],['Requêtes : restantes',g('remaining-requests')],['Requêtes : remise à zéro dans',g('reset-requests')],
    ['Tokens : limite',g('limit-tokens')],['Tokens : restants',g('remaining-tokens')],['Tokens : remise à zéro dans',g('reset-tokens')],
    ['Réessayer dans',h['retry-after']&&h['retry-after']+' s']].filter(r=>r[1]!=null&&r[1]!=='');
  const body=rows.length?rows.map(r=>`<tr><td class="mut" style="padding:2px 12px 2px 0">${r[0]}</td><td><b>${esc(r[1])}</b></td></tr>`).join('')
    :Object.entries(h).map(([k,v])=>`<tr><td class="mut" style="padding:2px 12px 2px 0">${esc(k)}</td><td><b>${esc(v)}</b></td></tr>`).join('');
  return `<table>${body}</table><p class="mut">Mesuré à ${new Date(L.t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})} avec ${esc(L.model)}. Chez Groq, les requêtes sont en général comptées par jour et les tokens par minute.</p>`;
}
function limFoot(){
  const L=st.limits;if(!L) return '';
  const rq=L.h['x-ratelimit-remaining-requests'],tk=L.h['x-ratelimit-remaining-tokens'];
  if(rq==null&&tk==null) return '';
  return `<p class="mut">Quota restant (mesuré à ${new Date(L.t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}) : ${rq!=null?rq+' requêtes':''}${rq!=null&&tk!=null?' · ':''}${tk!=null?tk+' tokens':''}</p>`;
}
// fetch avec nouvel essai automatique si la limite (429) est atteinte
async function post(url,init){
  for(let i=0;;i++){
    let r;
    try{r=await fetch(url,{...init,signal:AbortSignal.timeout(100000)})}
    catch(e){if(e.name==='TimeoutError'||e.name==='AbortError') throw new Error("Pas de réponse après 100 s : le modèle est trop lent ou surchargé. Essaie un modèle plus léger (ex. gemini-3.5-flash-lite) ou un effort « low ».");throw e}
    if(r.status!==429||i>=4) return r;
    const w=Math.min(parseFloat(r.headers.get('retry-after'))||20,70),prev=st.busy;
    st.busy=`Limite atteinte, nouvel essai dans ${Math.ceil(w)} s…`;render();
    await new Promise(ok=>setTimeout(ok,w*1000));
    st.busy=prev;render();
  }
}
// estimation grossière du nombre de tokens envoyés (français + LaTeX ≈ 2,8 caractères par token)
const estTok=ms=>Math.ceil(ms.map(m=>typeof m.content==='string'?m.content:'').join('').length/2.8)+ms.reduce((n,m)=>n+((m.imgs||(m.img?[m.img]:[])).length)*1000,0);
const tpmOf=s=>{
  const L=st.limits,h=L&&L.model===s.model?parseInt(L.h['x-ratelimit-limit-tokens']):NaN;
  return h||st.tpm?.[s.model]||0;
};
// plafonne la réponse pour que (prompt + réponse) tienne dans la limite par minute
function maxOut(s,ms){
  const tpm=tpmOf(s);let m=parseInt(s.maxout)||0;
  if(tpm){
    const cap=Math.floor(tpm-estTok(ms)*1.15-200);
    if(cap<600) throw new Error(`Requête trop volumineuse pour ta limite (${tpm} tokens par minute) : l'énoncé est trop long. Raccourcis-le ou découpe l'exo en plusieurs.`);
    m=m?Math.min(m,cap):cap;
  }
  return m;
}
// utilise le « modèle vision » (s'il est configuré) dès qu'un message contient une image
async function callAI(messages){
  const s0=settings(),hasImg=messages.some(m=>m.img||m.imgs),useV=hasImg&&s0.vkey&&s0.vmodel;
  let s=useV?{...s0,provider:s0.vprov,base:s0.vbase||s0.base,model:s0.vmodel,key:s0.vkey,effort:'',temp:''}:s0;
  for(let essai=0;;essai++){
    try{return await callAI0(messages,s)}
    catch(e){
      const m=e.message||'',x=/Limit (\d+),\s*(?:Used \d+,\s*)?Requested (\d+)/i.exec(m);
      if(x){st.tpm={...(st.tpm||{}),[s.model]:+x[1]};try{localStorage.setItem('mattexo.tpm',JSON.stringify(st.tpm))}catch{}}
      const trop=e.code==='cut'||/too large|tokens per minute|\bTPM\b|reduce (your|the) (message|prompt)|context length|maximum context|request_too_large/i.test(m);
      if(trop&&essai<1&&s.provider!=='anthropic'){
        // un seul nouvel essai : raisonnement réduit + réponse plafonnée à ce que ta limite autorise
        const prev=st.busy;st.busy='Requête trop longue : nouvel essai en mode économe…';render();
        s={...s,effort:'low'};st.busy=prev;continue;
      }
      if(trop) e.message=`Requête trop longue pour ta limite${tpmOf(s)?` (${tpmOf(s)} tokens par minute)`:''} : ${m} — Essais : décocher la vérification indépendante, mettre l'effort de raisonnement sur « low », générer une variante à la fois, ou raccourcir l'énoncé.`;
      if(hasImg&&!useV) e.message+=" — ce modèle ne lit peut-être pas les images : renseigne un « Modèle vision » dans Réglages.";
      throw e;
    }
  }
}
async function callAI0(messages,s){
  if(!s.key) throw new Error('Ajoute ta clé API dans Réglages.');
  const extra={};
  if(s.temp!==''&&!isNaN(parseFloat(s.temp))) extra.temperature=parseFloat(s.temp);
  const mo=maxOut(s,messages);
  if(s.provider==='anthropic'){
    const r=await post('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'content-type':'application/json','x-api-key':s.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:s.model,max_tokens:mo||8000,...extra,
        system:messages.filter(m=>m.role==='system').map(m=>m.content).join('\n'),
        messages:messages.filter(m=>m.role!=='system').map(m=>({role:m.role,content:toParts(m,'anthropic')}))})});
    captureLimits(r);const d=await r.json(); if(!r.ok) throw apiErr(r,d);
    return d.content.map(c=>c.text||'').join('');
  }
  if(s.effort) extra.reasoning_effort=s.effort;

function parseVar(b){

/* ---------- PDF ---------- */
/* Reconstruit le texte d'une page PDF en gardant exposants, indices et fractions (notation LaTeX). */
function layoutPage(raw){
  const items=raw.filter(it=>it.str!=='').map(it=>({s:it.str.replace(/−/g,'-'),x:it.transform[4],y:it.transform[5],
    size:Math.hypot(it.transform[0],it.transform[1])||it.height||10,w:it.width||0}));
  if(!items.length) return '';
  const wmed=list=>{const a=[];list.forEach(i=>{for(let k=0;k<Math.min(i.s.trim().length,20);k++)a.push(i.size)});
    a.sort((p,q)=>p-q);return a[Math.floor(a.length/2)]||(list[0]?list[0].size:10)};
  const base=wmed(items);
  const main=items.filter(i=>i.size>=0.85*base).sort((a,b)=>b.y-a.y);
  const lines=[];
  for(const it of main){const L=lines[lines.length-1];
    if(L&&Math.abs(it.y-L.y)<=0.45*base) L.items.push(it); else lines.push({y:it.y,items:[it]});}
  for(const it of items.filter(i=>i.size<0.85*base)){
    let best=null,bd=1e9;
    for(const L of lines){const d=Math.abs(it.y-L.y);if(d<bd){bd=d;best=L}}
    if(best&&bd<=1.3*base) best.items.push(it); else lines.push({y:it.y,items:[it]});
  }
  lines.sort((a,b)=>b.y-a.y);
  let out='',prevY=null;
  for(const L of lines){
    const t=layout(L.items,base).trim();if(!t) continue;
    if(prevY!==null&&prevY-L.y>2.2*base) out+='\n';
    out+=t+'\n';prevY=L.y;
  }
  return out;
}
function layout(items,base){
  items=items.slice().sort((a,b)=>a.x-b.x);
  const txt=items.filter(i=>i.s.trim());
  if(!txt.length) return items.map(i=>i.s).join('');
  const ys=txt.filter(i=>Math.abs(i.size-base)<=0.1*base).map(i=>i.y).sort((p,q)=>p-q);
  const lineY=ys[Math.floor(ys.length/2)]??txt[0].y;
  const mainI=items.filter(i=>i.size>=0.85*base),small=items.filter(i=>i.size<0.85*base);
  // regroupe les petits éléments en blocs (exposant, indice, numérateur, dénominateur)
  const cl=[];
  for(const it of small){
    let best=null,bd=1e9;
    for(const c of cl){const gap=it.x-c.x1,dy=Math.abs(it.y-c.y);
      if(gap<=0.6*it.size&&dy<=0.6*c.size&&dy<bd){bd=dy;best=c}}
    if(best){best.items.push(it);best.x1=Math.max(best.x1,it.x+it.w);
      if(it.size>=0.95*best.size){best.y=it.y;best.size=Math.max(best.size,it.size)}}
    else cl.push({items:[it],x0:it.x,x1:it.x+it.w,y:it.y,size:it.size});
  }
  cl.forEach(c=>{c.r=(c.y-lineY)/base});
  // fractions : un bloc au-dessus + un bloc en dessous, centrés l'un sur l'autre (sauf bornes de Σ, ∫…)
  const used=new Set(),fr=[];
  for(const d of cl.filter(c=>c.r<-0.3)){
    let best=null,bs=0;
    for(const n of cl.filter(c=>c.r>0.15&&!used.has(c))){
      const ov=Math.min(n.x1,d.x1)-Math.max(n.x0,d.x0),mw=Math.min(n.x1-n.x0,d.x1-d.x0);
      const cd=Math.abs((n.x0+n.x1)/2-(d.x0+d.x1)/2),xw=Math.max(n.x1-n.x0,d.x1-d.x0);
      if(mw>0&&ov>=0.6*mw&&cd<=0.35*xw&&n.y>d.y&&ov>bs){best=n;bs=ov}
    }
    if(!best) continue;
    const cx=(Math.min(best.x0,d.x0)+Math.max(best.x1,d.x1))/2;
    if(mainI.some(m=>m.s.trim()&&cx>m.x+0.2*m.w&&cx<m.x+0.8*m.w)) continue;
    used.add(best);used.add(d);fr.push({n:best,d});
  }
  const att=new Map();
  for(const c of cl){
    if(used.has(c)||(c.r<=0.15&&c.r>=-0.1)) continue;
    const cx=(c.x0+c.x1)/2,m=mainI.find(m=>m.s.trim()&&cx>m.x+0.2*m.w&&cx<m.x+0.8*m.w);
    if(m){(att.get(m)||att.set(m,[]).get(m)).push(c);used.add(c)}
  }
  const wrap=c=>{const t=layout(c.items,c.size).trim(),sp=/\s$/.test(c.items.map(i=>i.s).join(''))?' ':'';
    return (c.r>0.15?'^{'+t+'}':c.r<-0.1?'_{'+t+'}':t)+sp};
  const segs=[];
  for(const m of mainI){
    const at=(att.get(m)||[]).sort((p,q)=>q.r-p.r);
    segs.push({x:m.x,x1:m.x+m.w,t:m.s+at.map(wrap).join(''),main:true});
  }
  for(const c of cl) if(!used.has(c)) segs.push({x:c.x0,x1:c.x1,t:wrap(c)});
  for(const f of fr) segs.push({x:Math.min(f.n.x0,f.d.x0),x1:Math.max(f.n.x1,f.d.x1),
    t:' \\frac{'+layout(f.n.items,f.n.size).trim()+'}{'+layout(f.d.items,f.d.size).trim()+'} '});
  segs.sort((p,q)=>p.x-q.x);
  let o='',prev=null;
  for(const s of segs){
    if(prev&&s.x-prev.x1>0.2*base&&!/\s$/.test(o)&&!/^\s/.test(s.t)) o+=' ';
    o+=s.t;prev=s;
  }
  return o.replace(/\s+\}/g,'}').replace(/\{\s+/g,'{').replace(/[ \t]{2,}/g,' ');
}

async function extractPdf(file){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  let text='';const starts=[],pages=[];
  for(let p=1;p<=pdf.numPages;p++){
    st.busy=`Lecture de la page ${p}/${pdf.numPages}…`;render();
    const page=await pdf.getPage(p);
    starts.push(text.length);
    text+=san(layoutPage((await page.getTextContent()).items))+'\n';
    // image de la page : sert à vérifier l'extraction et à lire les schémas avec un modèle vision
    const w=page.getViewport({scale:1}).width,vp=page.getViewport({scale:Math.min(2,1000/w)});
    const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
    await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    pages.push(c.toDataURL('image/jpeg',.6));
  }
  return {text,starts,pages};
}
function splitExos(text,starts=[0]){

  const idx=[...text.matchAll(/^[ \t]*(?:exercice|exo|probl[eè]me)\s*\d+.*$/gim)].map(m=>m.index);
  if(!idx.length) return [mk(text.trim(),0,text.length,'Exercice 1')];
  return idx.map((s,i)=>{
    const e=idx[i+1]??text.length,chunk=text.slice(s,e).trim();

/* ---------- synchronisation entre appareils (Supabase) ---------- */
const RB={
  c:null,k:'',
  cli(){
    const s=settings();if(!s.sbUrl||!s.sbKey||!window.supabase) return null;
    const k=s.sbUrl+'|'+s.sbKey;
    if(!this.c||this.k!==k){this.c=window.supabase.createClient(s.sbUrl.trim(),s.sbKey.trim());this.k=k}
    return this.c;
  },
  async user(){const c=this.cli();if(!c) return null;const {data}=await c.auth.getSession();return data.session?.user||null},
  async list(){const {data,error}=await this.cli().from('mattexo_docs').select('id,kind,updated,deleted');if(error) throw error;return data||[]},
  async fetch(ids){
    const out=[];
    for(let i=0;i<ids.length;i+=6){
      const {data,error}=await this.cli().from('mattexo_docs').select('id,kind,data,updated,deleted').in('id',ids.slice(i,i+6));
      if(error) throw error;out.push(...data);
    }
    return out;
  },
  async upsert(rows){for(const r of rows){const {error}=await this.cli().from('mattexo_docs').upsert(r,{onConflict:'user_id,id'});if(error) throw error}}
};
let syncing=false,syncTimer=null;
function scheduleSync(){if(!settings().sbUrl) return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(true),3000)}
// Chaque document (TD, erreur) porte un horodatage « updated » : le plus récent gagne. Les pages-images sont synchronisées à part.
async function syncNow(silent){
  if(syncing) return;
  const user=await RB.user().catch(()=>null);
  if(!user){if(!silent) throw new Error("Connecte-toi d'abord (Réglages → Synchronisation).");return}
  syncing=true;st.sync='Synchronisation…';
  try{
    const remote=new Map((await RB.list()).map(r=>[r.id,r])),tomb=getTomb();
    let tds=await DB.all('tds'),errs=await DB.all('errs'),changed=false;
    for(const d of tds) if(!d.updated){d.updated=Date.now();await DB.putRaw('tds',d)}
    for(const d of errs) if(!d.updated){d.updated=Date.now();await DB.putRaw('errs',d)}
    const tdMap=new Map(tds.map(t=>[t.id,t])),erMap=new Map(errs.map(e=>[e.id,e]));
    // 1) ce qui est plus récent à distance
    const need=[];
    for(const [id,r] of remote){
      if(id.startsWith('pg:')) continue;
      const loc=(id.startsWith('td:')?tdMap:erMap).get(id.slice(3));
      if(r.updated>(loc?.updated||0)&&r.updated>(tomb[id]||0)) need.push(id);
    }
    for(const r of await RB.fetch(need)){
      const store=r.id.startsWith('td:')?'tds':'errs',key=r.id.slice(3);
      if(r.deleted){await DB.delRaw(store,key);changed=true;continue}
      const d=r.data||{};d.updated=r.updated;
      if(store==='tds'){const old=tdMap.get(key);d.pages=old?.pages;d.pagesStamp=old?.pagesStamp||0}
      await DB.putRaw(store,d);changed=true;
    }
    tds=await DB.all('tds');
    for(const t of tds) if(t.pages?.length&&!t.pagesStamp){t.pagesStamp=t.updated||Date.now();await DB.putRaw('tds',t)}
    tds=await DB.all('tds');
    const needPg=tds.filter(t=>{const r=remote.get('pg:'+t.id);return r&&!r.deleted&&(!t.pages?.length||r.updated>(t.pagesStamp||0))&&r.updated>(tomb['pg:'+t.id]||0)}).map(t=>'pg:'+t.id);
    for(const r of await RB.fetch(needPg)){
      const t=tds.find(x=>'pg:'+x.id===r.id);
      if(t&&r.data?.pages){t.pages=r.data.pages;t.pagesStamp=r.updated;await DB.putRaw('tds',t);changed=true}
    }
    errs=await DB.all('errs');
    // 2) ce qui est plus récent ici
    const up=[],ru=id=>remote.get(id)?.updated||0;
    for(const t of tds){
      const {pages,...data}=t;
      if(!remote.has('td:'+t.id)||(t.updated||0)>ru('td:'+t.id)) up.push({id:'td:'+t.id,kind:'td',data,updated:t.updated,deleted:false});
      if(pages?.length&&(!remote.has('pg:'+t.id)||(t.pagesStamp||0)>ru('pg:'+t.id))) up.push({id:'pg:'+t.id,kind:'pg',data:{pages},updated:t.pagesStamp,deleted:false});
    }
    for(const e of errs) if(!remote.has('er:'+e.id)||(e.updated||0)>ru('er:'+e.id)) up.push({id:'er:'+e.id,kind:'er',data:e,updated:e.updated,deleted:false});
    for(const [id,tm] of Object.entries(tomb)) if(remote.has(id)&&tm>ru(id)) up.push({id,kind:id.slice(0,2),data:null,updated:tm,deleted:true});
    if(up.length) await RB.upsert(san(up.map(r=>({user_id:user.id,...r}))));
    if(changed){
      st.tds=await DB.all('tds');st.errs=await DB.all('errs');
      if(st.tdId&&!curTd()){st.tdId=null;st.view='home'}
      if(st.tdId&&!curExo()) st.exoId=curTd().exos[0]?.id;
    }
    st.sync='Synchronisé à '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+` · ${up.length} envoyé(s)`+(changed?' · mises à jour reçues':'')+` · ${tds.length} TD en local`;
    if(changed&&!st.busy&&!document.activeElement?.matches?.('textarea,input,select')) render();
  }catch(e){
    st.sync='Erreur de synchro : '+(e.message||e);
    if(!silent) throw e;
  }finally{syncing=false}
}

function parseSkills(t){

    ms.forEach((m,i)=>{o[NORM(m[1])]=b.slice(m.index+m[0].length,i+1<ms.length?ms[i+1].index:undefined).replace(/^[ \t]*={2,}.*$/gm,'').trim()});
    return {kind:/pr[ée]cis/i.test(o.TYPE||'')?'precise':'general',parent:(o.PARENT||'').split('\n')[0].replace(/^\*+|\*+$/g,'').trim(),
      title:(o.TITRE||'').split('\n')[0].replace(/^\*+|\*+$/g,'').trim(),when:o.QUAND||'',steps:o.ETAPES||'',restr:o.RESTRICTIONS||'',example:o.EXEMPLE||''};

function skMerge(td,ex,items){
  const all=td.skills;let n=0;
  const find=t=>all.find(x=>nrm(x.title)===nrm(t));
  const findG=t=>{const q=nrm(t);if(!q) return null;return all.find(x=>x.kind==='general'&&nrm(x.title)===q)||all.find(x=>x.kind==='general'&&(nrm(x.title).includes(q)||q.includes(nrm(x.title))))||null};
  items.sort((a,b)=>(a.kind==='precise')-(b.kind==='precise'));
  for(const it of items){
    const old=find(it.title);
    if(old){
      if(!(old.exos||[]).includes(ex.id)) (old.exos??=[]).push(ex.id);
      for(const k of ['when','steps','restr','example']) if(!old[k]&&it[k]) old[k]=it[k];
      continue;
    }
    const par=it.kind==='precise'?findG(it.parent):null;
    all.push({id:uid(),kind:it.kind,parent:par?par.id:null,title:it.title,when:it.when,steps:it.steps,restr:it.restr,example:it.example,exos:[ex.id],created:Date.now(),done:false});

    const td=curTd();td.skills=td.skills.filter(x=>x.id!==d.id);td.skills.forEach(x=>{if(x.parent===d.id) x.parent=null});
    st.skId=null;await saveTd(td);render()},
  async 'sk-clear'(){
    if(!confirm('Vider tout le carnet de ce chapitre ?')) return;
    const td=curTd();td.skills=[];st.skId=null;await saveTd(td);render()},
  'sk-print'(){printSkills(curTd())},
  async 'sk-extract'(d){
    const td=curTd(),list=(d.scope==='exo'?[curExo()].filter(Boolean):td.exos).filter(e=>((e.clean||'')+(e.text||'')).trim());
    if(!list.length){st.err="Aucun énoncé exploitable : importe ou écris l'énoncé de l'exercice.";return render()}
    if(st.view==='td') st.rt='skills';
    await run('Skill Hunter…',async()=>{
      let added=0,fail=null;
      for(let i=0;i<list.length&&!fail;i++){
        st.busy=`Skill Hunter : ${list[i].label} (${i+1}/${list.length})…`;const bb=$('.banner.busy');if(bb) bb.textContent='⏳ '+st.busy;else render();
        try{added+=await skExtract(td,list[i])}catch(e){fail=e}
      }
      if(fail) throw new Error(fail.message+(added?` — ${added} méthode(s) déjà ajoutée(s) au carnet.`:''));
    });
  },
  home(){st.view='home';render()},
  carnet(){st.view='carnet';render()},
  settings(){st.view='settings';render()},
  'open-td'(d){st.tdId=d.id;st.exoId=curTd().exos[0]?.id;st.tab='orig';st.view='td';render()},
  'sel-exo'(d){st.exoId=d.id;st.tab='orig';render()},
  tab(d){st.tab=d.k;render()},
  'toggle-corr'(d){st.show[d.key]=!st.show[d.key];render()},
  async import(){
    const file=$('#n-pdf').files[0],title0=v('n-title'),subj0=v('n-subj')||'';let text=v('n-text')||'',pages=[],starts=[0];
    await run('Lecture du PDF…',async()=>{
      if(file){const r=await extractPdf(file);text=r.text;pages=r.pages;starts=r.starts}
      if(!text.trim()&&!pages.length) throw new Error('Ajoute un PDF ou du texte.');
      const exos=text.trim()?splitExos(text,starts):pages.map((_,i)=>({id:uid(),label:'Page '+(i+1),text:'',variants:{},pageFrom:i,pageTo:i}));
      const td={id:uid(),title:title0||file?.name.replace(/\.pdf$/i,'')||'TD',created:Date.now(),subject:subj0,pages,pagesStamp:pages.length?Date.now():0,exos};
      st.tds.push(td);await saveTd(td);
      st.tdId=td.id;st.exoId=td.exos[0]?.id;st.tab='orig';st.view='td';
    });
  },
  async 'del-td'(d){if(!confirm('Supprimer ce TD et ses erreurs ?'))return;
    await DB.del('tds',d.id);st.tds=st.tds.filter(t=>t.id!==d.id);
    for(const e of st.errs.filter(e=>e.tdId===d.id)) await DB.del('errs',e.id);
    st.errs=st.errs.filter(e=>e.tdId!==d.id);render()},
  async 'add-exo'(){const td=curTd();const e={id:uid(),label:'Exercice '+(td.exos.length+1),text:'',variants:{}};
    td.exos.push(e);st.exoId=e.id;st.tab='orig';await saveTd(td);render()},
  async 'save-exo'(){
    const ex=curExo();ex.label=v('x-label')||ex.label;ex.text=v('x-text');
    const c=(v('x-clean')||'').trim();if(c!==(ex.clean||'').trim()){ex.clean=c;ex.trusted=!!c} // tu as modifié l'énoncé : il fait foi
    await saveTd(curTd());render()},
  async validate(){const ex=curExo();ex.clean=(v('x-clean')||'').trim();ex.text=v('x-text');ex.trusted=!!ex.clean;await saveTd(curTd());render()},
  'show-imgs'(){st.showImgs=!st.showImgs;render()},
  async 'del-imgs'(){const ex=curExo();ex.imgs=[];await saveTd(curTd());render()},
  async 'read-img'(){
    const td=curTd(),ex=curExo(),imgs=exoImgs(td,ex);
    if(!imgs.length){st.err="Aucune image : importe un PDF ou ajoute une capture avec « + Image ».";return render()}
    await run("Lecture du texte de l'image…",async()=>{await readImg(td,ex,imgs)});
  },
  async 'clean-img'(){
    const td=curTd(),ex=curExo(),imgs=exoImgs(td,ex);
    if(!imgs.length){st.err="Aucune image : importe un PDF ou ajoute une capture avec « + Image ».";return render()}
    await run("Lecture du texte de l'image…",async()=>{
      await readImg(td,ex,imgs);
      st.busy='Mise en LaTeX…';render();
      await toLatex(td,ex);
    });
  },
  async 'del-exo'(){if(!confirm('Supprimer cet exo ?'))return;const td=curTd();
    td.exos=td.exos.filter(e=>e.id!==st.exoId);st.exoId=td.exos[0]?.id;await saveTd(td);render()},
  async gen(d){
    const td=curTd(),ex=curExo(),levels=d.lv==='all'?['facile','moyen','difficile']:[d.lv];
    if(!((ex.clean||'')+(ex.text||'')).trim()){st.err="L'énoncé est vide : écris-le, ou utilise « Lire avec l'image ».";return render()}
    await run('Génération…',async()=>{
      // une requête par variante : plus petites (limite par minute), et chaque variante réussie est enregistrée tout de suite
      const notes=levels.length<3?[ex.notes].filter(Boolean):[];let done=0,fail=null;
      for(let i=0;i<levels.length&&!fail;i++){
        const l=levels[i],tag=`${LV[l]} (${i+1}/${levels.length})`;
        try{
          st.busy=`${tag} : génération…`;render();
          let raw,S,p=null,last=null;
          for(let t=0;t<3&&!p;t++){
            try{
              const extra=t?"\n\nIMPORTANT : respecte STRICTEMENT le format demandé (marqueurs ===SECTION=== puis <<ENONCE>> et <<CORRECTION>>), sans rien avant ni après. Sois concis."+(t>1?" Réponse courte : correction condensée.":""):'';
              raw=await callAI([{role:'system',content:sys()},{role:'user',content:genPrompt(ex,[l],i===0)+extra}]);
              S=parseSections(raw);
              const b=sec(S,l),q=b?parseVar(b):null;
              if(q&&q.enonce&&q.correction) p=q; else last=new Error('Réponse illisible. Début reçu : '+JSON.stringify((raw||'(vide)').slice(0,300)));
            }catch(e){last=e;if(/clé|key|401|403|invalid api/i.test(e.message)) throw e}
            if(!p&&t<2){st.busy=`${tag} : nouvel essai…`;render();await new Promise(r=>setTimeout(r,1500))}
          }
          if(!p) throw last;
          if(S.ORIGINAL&&!(ex.clean||'').trim()) ex.clean=S.ORIGINAL;
          if(S.RAISONNEMENT&&(i===0||!ex.reasoning)) ex.reasoning=S.RAISONNEMENT;
          ex.variants[l]=p;
          if(settings().verify){
            st.busy=`${tag} : résolution indépendante…`;render();
            const blind=await callAI([{role:'system',content:sys()},{role:'user',content:blindPrompt(`### ${LV[l]}\n${p.enonce}`)}]);
            st.busy=`${tag} : comparaison et correction…`;render();
            const ver=await callAI([{role:'system',content:sys()},{role:'user',content:verifyPrompt(`===${l.toUpperCase()}===\n<<ENONCE>>\n${p.enonce}\n<<CORRECTION>>\n${p.correction}`,blind)}]);
            const SV=parseSections(ver),b2=sec(SV,l);
            if(b2&&!/^\s*OK\b/i.test(b2)){
              // la vérification ne remplace la variante que si elle la renvoie complète
              const p2=parseVar(b2);
              if(p2.enonce&&p2.correction&&p2.correction.length>=0.5*p.correction.length){ex.variants[l]=p2;notes.push(LV[l]+' : '+(SV.NOTES||'corrigée'))}
            }
          }
          ex.notes=notes.join('\n');
          await saveTd(td);done++;
        }catch(e){fail={l,e}}
      }
      st.tab=d.lv==='all'?(ex.variants.facile?'facile':'orig'):(ex.variants[d.lv]?d.lv:'orig');
      if(fail) throw new Error(`${LV[fail.l]} : ${fail.e.message}`+(done?` — ${done} variante(s) déjà enregistrée(s), relance « Régénérer » sur l'onglet manquant.`:''));
    });
  },
  async explain(d){
    const ex=curExo(),vr=ex.variants[d.lv],key=ex.id+d.lv,q=v('ask')?.trim()||'Réexplique cette correction plus lentement, étape par étape, en expliquant pourquoi on fait chaque choix.';
    st.clr=['ask'];
    await run('Explication…',async()=>{
      const a=await callAI([{role:'system',content:sys()},{role:'user',content:`Énoncé :\n${vr.enonce}\n\nCorrection :\n${vr.correction}\n\nMa question : ${q}`}]);
      (st.chat[key]=st.chat[key]||[]).push({q,a});
    });
  },
  async review(d){
    const td=curTd(),ex=curExo(),k=d.k,mine=v('mine')?.trim(),f=$('#mine-img').files[0];
    if(!mine&&!f){st.err='Écris ta réponse ou joins une photo.';return render()}
    const vr=ex.variants[k],enonce=k==='orig'?(ex.clean||ex.text):vr.enonce;
    await run('Correction de ta réponse…',async()=>{
      const img=f?await imgData(f):null;
      const raw=await callAI([{role:'system',content:sys()},{role:'user',content:reviewPrompt(enonce,vr?.correction,mine),img}]);
      const S=parseSections(raw);
      const errs=(S.ERREURS||'').split('\n').map(l=>l.replace(/^[-•*\s]+/,'')).filter(l=>l.includes('|')).map(l=>{
        const [t,...r]=l.split('|');return {tag:TAGS.find(x=>x.toLowerCase()===t.trim().toLowerCase())||'Autre',text:r.join('|').trim()}});
      (ex.reviews??={})[k]??=[];
      ex.reviews[k].push({mine,fb:S.RETOUR||raw,errs,added:false,date:Date.now()});
      await saveTd(td);
    });
  },
  async 'rev-errs'(d){
    const ex=curExo(),r=ex.reviews[d.k][+d.i];
    for(const e of r.errs){const x={id:uid(),tdId:st.tdId,exoId:ex.id,variant:d.k,tag:e.tag,text:e.text,fix:'',created:Date.now(),resolved:false};st.errs.push(x);await DB.put('errs',x)}
    r.added=true;await saveTd(curTd());render();
  },
  async 'test-limit'(){
    const t0=Date.now();
    await run('Mesure de la limite…',async()=>{
      await callAI([{role:'user',content:'Réponds uniquement : ok'}]);
      if(!st.limits||st.limits.t<t0) throw new Error("Ce fournisseur n'expose pas les en-têtes de limite au navigateur : la limite exacte est visible sur son site (page « Limits » / « Rate limits »).");
    });
  },
  async clean(){
    const td=curTd(),ex=curExo();
    if(!(ex.text||'').trim()){st.err="Le texte brut est vide : utilise « Lire avec l'image ».";return render()}
    await run('Mise en LaTeX…',async()=>{await toLatex(td,ex)});
  },
  'preset-vgemini'(){$('#s-vprov').value='openai';$('#s-vbase').value='https://generativelanguage.googleapis.com/v1beta/openai';$('#s-vmodel').value='gemini-3.8-flash'},
  'preset-vopenai'(){$('#s-vprov').value='openai';$('#s-vbase').value='https://api.openai.com/v1';$('#s-vmodel').value='gpt-4.1'},
  'save-sb'(){
    localStorage.setItem('mattexo.settings',JSON.stringify({...settings(),sbUrl:v('s-sburl').trim(),sbKey:v('s-sbkey').trim()}));
    st.err='';alert('Config enregistrée. Connecte-toi maintenant.');render()},
  async 'sb-login'(){const email=(v('s-email')||'').trim(),pass=v('s-pass')||'';await run('Connexion…',async()=>{
    const c=RB.cli();if(!c) throw new Error("Enregistre d'abord l'URL et la clé Supabase (et vérifie ta connexion internet).");
    const {error}=await c.auth.signInWithPassword({email,password:pass});if(error) throw error;
    st.sbUser=(await RB.user())?.email;await syncNow(false);
  })},
  async 'sb-signup'(){const email=(v('s-email')||'').trim(),pass=v('s-pass')||'';await run('Création du compte…',async()=>{
    const c=RB.cli();if(!c) throw new Error("Enregistre d'abord l'URL et la clé Supabase (et vérifie ta connexion internet).");
    const {data,error}=await c.auth.signUp({email,password:pass});if(error) throw error;
    if(!data.session) throw new Error("Compte créé. Confirme l'e-mail reçu (ou désactive « Confirm email » dans Supabase → Authentication → Providers → Email), puis clique sur « Se connecter ».");
    st.sbUser=data.user?.email;await syncNow(false);
  })},
  async 'sb-logout'(){const c=RB.cli();if(c) await c.auth.signOut();st.sbUser=null;st.sync='';render()},
  async sync(){await run('Synchronisation…',()=>syncNow(false))},
  'preset-gemini'(){
    $('#s-prov').value='openai';$('#s-base').value='https://generativelanguage.googleapis.com/v1beta/openai';$('#s-model').value='gemini-3.8-flash';
    $('#s-eff').value='low';$('#s-temp').value='';
  },
  'preset-groq'(){
    $('#s-prov').value='openai';$('#s-base').value='https://api.groq.com/openai/v1';$('#s-model').value='openai/gpt-oss-120b';
    $('#s-eff').value='medium';$('#s-temp').value='0.2';
  },
  async 'add-err'(){
    const text=v('f-text')?.trim();if(!text)return;
    const exoId=v('f-exo'),e={id:uid(),tdId:st.tdId,exoId,variant:v('f-var'),tag:v('f-tag'),text,fix:v('f-fix')?.trim()||'',created:Date.now(),resolved:false};
    st.errs.push(e);await DB.put('errs',e);st.clr=['f-text','f-fix'];render();
  },
  async plan(d){
    const td=curTd(),ex=curExo(),k=d.k,plan=v('plan')?.trim();
    if(!plan){st.err="Écris d'abord ton plan d'attaque.";return render()}
    const vr=ex.variants[k],en=k==='orig'?(ex.clean||ex.text):vr.enonce;
    await run("Évaluation du plan…",async()=>{
      const raw=await callAI([{role:'system',content:sys()},{role:'user',content:planPrompt(en,k==='orig'?'':vr?.correction,plan)}]);
      (ex.plans??={})[k]??=[];ex.plans[k].push({plan,fb:(raw||'').trim()||'(réponse vide, réessaie)',date:Date.now()});
      await saveTd(td);
    });
  },
  theme(){const u=ui(),cur=u.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');setUI({theme:cur==='light'?'dark':'light'});if(st.view==='settings')render()},
  'ui-theme'(d){setUI({theme:d.v});render()},
  'ui-size'(d){setUI({size:Math.max(12,Math.min(24,ui().size+ +d.d))});render()},
  async prog(d){const ex=curExo();ex.prog=ex.prog||{};ex.prog[d.k]=ex.prog[d.k]===d.s?'':d.s;await saveTd(curTd());render()},
  async 'rev-ok'(d){const e=st.errs.find(x=>x.id===d.id);
    if(d.ok==='1'){e.box=(e.box||0)+1;if(e.box>=INTERVALS.length){e.resolved=true}else e.due=Date.now()+INTERVALS[e.box]*DAY}
    else{e.box=0;e.due=Date.now()+DAY}
    await DB.put('errs',e);render()},
  'export-exo'(){printDoc(curTd(),[curExo()])},
  'export-td'(){const td=curTd();printDoc(td,td.exos)},
  async 'toggle-err'(d){const e=st.errs.find(x=>x.id===d.id);e.resolved=!e.resolved;await DB.put('errs',e);render()},
  async 'del-err'(d){st.errs=st.errs.filter(x=>x.id!==d.id);await DB.del('errs',d.id);render()},
  'goto-err'(d){const e=st.errs.find(x=>x.id===d.id);st.tdId=e.tdId;st.exoId=e.exoId;st.tab=e.variant;st.view='td';render()},
  'save-set'(){
    localStorage.setItem('mattexo.settings',JSON.stringify({...settings(),provider:v('s-prov'),base:v('s-base'),model:v('s-model'),key:v('s-key'),verify:$('#s-ver').checked,effort:v('s-eff'),temp:v('s-temp').trim(),maxout:v('s-maxout').trim(),
      vprov:v('s-vprov'),vbase:v('s-vbase').trim(),vmodel:v('s-vmodel').trim(),vkey:v('s-vkey').trim()}));
    st.err='';alert('Enregistré.')},
  export(){
    const b=new Blob([JSON.stringify({tds:st.tds,errs:st.errs})],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mattexo-backup.json';a.click()},
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const f=A[b.dataset.act];if(f)f(b.dataset);
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='c-tag'){st.ferr.tag=t.value;render()}
  if(t.id==='c-res'){st.ferr.res=t.value;render()}
  if(t.id==='sk-td'){st.tdId=t.value;render()}
  if(t.id==='td-subj'){const td=curTd();td.subject=t.value;await saveTd(td)}
  if(t.id==='x-img'&&t.files[0]){
    try{const ex=curExo();(ex.imgs??=[]).push(await imgData(t.files[0]));await saveTd(curTd());st.showImgs=true;render()}
    catch{st.err="Image illisible.";render()}
  }
  if(t.id==='imp'&&t.files[0]){
    try{const d=JSON.parse(await t.files[0].text());
      for(const x of d.tds) await DB.put('tds',x);for(const x of d.errs) await DB.put('errs',x);
      st.tds=await DB.all('tds');st.errs=await DB.all('errs');alert('Import terminé.');
    }catch{alert('Fichier invalide.')}
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='sk-q'){st.skQ=e.target.value;clearTimeout(st._skT);st._skT=setTimeout(()=>{const td=curTd(),l=$('#sk-list');if(td&&l){l.innerHTML=vSkRows(td);math(l)}},150);return}
  if(e.target.id==='c-q'){st.ferr.q=e.target.value;const p=e.target.selectionStart;render();const i=$('#c-q');i.focus();i.setSelectionRange(p,p)}
});

if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
addEventListener('load',async()=>{
  const u=await RB.user().catch(()=>null);
  if(u){st.sbUser=u.email;syncNow(true)}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&st.sbUser) syncNow(true)});
(async()=>{await DB.open();st.tds=await DB.all('tds');st.errs=await DB.all('errs');render()})();
